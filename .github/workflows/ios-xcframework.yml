name: Build SharedLogic XCFramework

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "sharedLogic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios-xcframework.yml"

jobs:
  xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :sharedLogic:assembleSharedLogicReleaseXCFramework --no-configuration-cache

      - name: Zip XCFramework
        run: |
          cd sharedLogic/build/XCFrameworks/release
          zip -r -y SharedLogic.xcframework.zip SharedLogic.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: SharedLogic.xcframework
          path: sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip
